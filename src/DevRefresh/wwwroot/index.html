<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Сервис актуализации баз разработки 1С">
  <meta name="theme-color" content="#0a1e23">
  <title>DevRefresh</title>
  <link rel="stylesheet" href="/styles.css?v=0.2.57">
  <script src="/dashboard.js?v=0.2.39" defer></script>
  <script src="/app.js?v=0.2.61" defer></script>
  <script src="/mcp.js?v=0.2.57" defer></script>
  <script src="/workflow.js?v=0.2.56" defer></script>
  <script src="/dev-analysis.js?v=0.2.53" defer></script>
</head>
<body>
  <div id="app"><div class="loading">Подключаемся к DevRefresh…</div></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="database-dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="refresh-confirmation" aria-labelledby="refresh-confirmation-title">
    <h2 id="refresh-confirmation-title">Подтверждение актуализации</h2>
    <p id="refresh-confirmation-target"></p>
    <p>Открытые соединения с этой базой будут завершены при замене.</p>
    <form method="dialog" class="dialog-actions">
      <button class="button" value="cancel" autofocus>Отменить операцию</button>
      <button class="button primary" value="confirm">Да</button>
    </form>
  </dialog>
  <dialog id="job-dialog" class="wide"></dialog>
</body>
</html>
