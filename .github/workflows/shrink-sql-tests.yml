name: Shrink SQL integration tests
on:
  push:
    branches: [verify-shrink-v0.2.50]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DEVREFRESH_TEST_LOCALDB: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run SQL integration tests
        run: dotnet test tests/DevRefresh.Tests/DevRefresh.Tests.csproj -c Release --filter FullyQualifiedName~ShrinkTableRewriteTests --logger "console;verbosity=normal"
